<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloudSync — Password Vault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

  <div class="bg-mesh"></div>
  <div class="bg-grid"></div>

  <div class="auth-wrap">
    <div class="auth-brand">
      <div class="brand-icon">⬡</div>
      <span class="brand-name">CloudSync</span>
    </div>

    <div class="auth-card">
      <div class="tab-row">
        <button class="tab-btn active" data-tab="login" onclick="switchTab('login')">Sign In</button>
        <button class="tab-btn" data-tab="signup" onclick="switchTab('signup')">Sign Up</button>
        <div class="tab-indicator"></div>
      </div>

      <h2 id="tab-title">Welcome back</h2>
      <p class="auth-sub">Your passwords, secured and synced.</p>

      <div class="field">
        <label>Email</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
      </div>

      <div class="field">
        <label>Password</label>
        <div class="input-group">
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
          <button class="eye-btn" type="button" onclick="toggleEye()">👁</button>
        </div>
      </div>

      <button class="primary-btn" id="action-btn" onclick="login()">Sign In</button>

      <p class="auth-hint">
        <span id="hint-text">No account? </span>
        <a href="#" onclick="switchTab('signup'); return false;">Create one →</a>
      </p>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="supabase.js"></script>
  <script src="auth.js"></script>
  <script>
    function toggleEye() {
      const inp = document.getElementById("password");
      inp.type = inp.type === "password" ? "text" : "password";
    }
  </script>
</body>
</html>
